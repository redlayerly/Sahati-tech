<div class="atlas-page">

  <!-- Hero Header -->
  <header class="atlas-hero">
    <div class="wrap">
      <div>
        <span class="eyebrow">{{s:atlas_eyebrow}}</span>
        <h1>{{s:atlas_h1}}</h1>
      </div>
      <div>
        <p>{{s:atlas_lead}}</p>
        <div class="atlas-meta-bar">
          <span>{{s:atlas_meta_1}}</span>
          <span>{{s:atlas_meta_2}}</span>
          <span>{{s:atlas_meta_3}}</span>
          <span>{{s:atlas_meta_4}}</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Control & Filter Bar -->
  <section class="atlas-controls">
    <div class="wrap">
      <div class="atlas-search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="atlasSearch" placeholder="{{s:atlas_search_placeholder}}" aria-label="{{s:atlas_search_placeholder}}">
      </div>
      <div class="atlas-actions">
        <button type="button" class="atlas-btn" id="expandAllBtn">{{s:atlas_expand_all}}</button>
        <button type="button" class="atlas-btn" id="collapseAllBtn">{{s:atlas_collapse_all}}</button>
      </div>
    </div>
  </section>

  <!-- Ascent Path (Design C) -->
  <section class="c-grid" id="ascentGrid">
    <aside class="c-sticky" aria-label="3D Ascent View">
      <canvas id="cCanvas" aria-label="3D Ascent View, drag to rotate"></canvas>
      <div class="c-meter" id="cMeter" aria-hidden="true"></div>
      <div class="c-hint-drag">{{s:atlas_drag_hint}}</div>
    </aside>
    <div class="c-steps" id="cSteps">
      <!-- Populated via JavaScript dynamically based on current language -->
    </div>
  </section>

</div>

var root = document.documentElement;
function getThemeColors() {
  var s = getComputedStyle(root);
  return {
    bg: s.getPropertyValue('--bg').trim() || '#EFEBE2',
    card: s.getPropertyValue('--card').trim() || '#FFFFFF',
    ink: s.getPropertyValue('--ink').trim() || '#26282B',
    accent: s.getPropertyValue('--accent').trim() || '#8A6A4A',
    line: s.getPropertyValue('--line').trim() || '#E0DCD3'
  };
}

/* ------------------------------------------------------------------
   HTML Rendering (Strictly Clean, Multilingual-Aware)
   ------------------------------------------------------------------ */
function renderTerms(terms, isAr) {
  return '<div class="term-grid">' + terms.map(function(t){
    var tags = t.tags ? '<div class="term-tags">' + t.tags.map(function(tg){
      return '<span class="term-tag">' + tg + '</span>';
    }).join('') + '</div>' : '';

    var mainTitle = isAr ? t.ar : t.en;
    var subBadge = isAr ? t.en : t.ar;
    var descText = isAr ? t.d : (t.d_en || t.d);
    var searchStr = (t.ar + ' ' + t.en + ' ' + descText).toLowerCase();

    return '<article class="term-card" data-search="' + searchStr + '">' +
      '<div class="term-top">' +
        '<span class="term-title">' + mainTitle + '</span>' +
        '<span class="term-badge">' + subBadge + '</span>' +
      '</div>' +
      '<p class="term-desc">' + descText + '</p>' +
      tags +
    '</article>';
  }).join('') + '</div>';
}

function renderPackages(pkgs, isAr, lang) {
  return '<div class="packs">' + pkgs.map(function(pkg, idx){
    var pkgName = isAr ? pkg.t : ((I18N.pkgs[pkg.id] && I18N.pkgs[pkg.id][lang]) || pkg.en);
    var pkgDesc = isAr ? pkg.desc : (pkg.desc_en || pkg.desc);
    var pkgBadge = isAr ? ('الحزمة ' + pkg.id) : ('PKG ' + pkg.id);

    return '<details class="pkg-accordion" data-pkg="' + pkg.id + '"' + (idx === 0 ? ' open' : '') + '>' +
      '<summary>' +
        '<span class="pkg-num">' + pkgBadge + '</span>' +
        '<span class="pkg-name">' + pkgName + '</span>' +
        '<span class="icon-toggle">+</span>' +
      '</summary>' +
      '<div class="pkg-body">' +
        '<p class="pkg-desc">' + pkgDesc + '</p>' +
        renderTerms(pkg.terms, isAr) +
      '</div>' +
    '</details>';
  }).join('') + '</div>';
}

function renderSI(isAr) {
  var ladder = '<div class="ladder">' + SI.ladder.map(function(item, idx){
    var title = isAr ? item.t : item.t_en;
    var desc = isAr ? item.d : item.d_en;
    var status = isAr ? item.st : item.st_en;

    return '<div class="ladder-item' + (idx === 2 ? ' active' : '') + '">' +
      '<span class="badge">' + item.k + '</span>' +
      '<h4>' + title + '</h4>' +
      '<p>' + desc + '</p>' +
      '<span class="status">' + status + '</span>' +
    '</div>';
  }).join('') + '</div>';

  var insights = '<div class="si-insights">' + SI.insights.map(function(ins){
    var text = isAr ? ins.ar : ins.en;
    return '<div class="si-insight">' + text + '</div>';
  }).join('') + '</div>';

  return ladder + insights;
}

  var isAr = (lang === 'ar');

  stepsEl.innerHTML = ALL.map(function(stage, idx){
    var isSI = (stage.id === 'si');
    var content = isSI ? renderSI(isAr) : renderPackages(stage.pkgs, isAr, lang);

    var stageTitle = isAr ? stage.t : ((I18N.stages[stage.id] && I18N.stages[stage.id][lang]) || stage.en);
    var stageLead = isAr ? stage.d : (stage.d_en || stage.d);
    var badgeText = isSI ?
      (isAr ? 'القمة · ما بعد خارطة الطريق' : 'SUMMIT · BEYOND THE ROADMAP') :
      (isAr ? ('المرحلة ' + stage.n + ' / 06 · ' + stage.en) : ('STAGE ' + stage.n + ' / 06 · ' + stage.en));

    return '<section class="c-step" data-index="' + idx + '" id="stage-' + stage.id + '">' +
      '<div class="c-card">' +
        '<div class="step-head">' +
          '<span class="num">' + badgeText + '</span>' +
          '<h2>' + stageTitle + '</h2>' +
          '<p class="lead">' + stageLead + '</p>' +
        '</div>' +
        content +
      '</div>' +
    '</section>';
  }).join('');

  meterEl.innerHTML = ALL.map(function(stage){
    return '<span>' + stage.n + '</span>';
  }).join('');
}

buildDOM();

/* ------------------------------------------------------------------
   Interactive Search & Filtering
   ------------------------------------------------------------------ */
var searchInput = document.getElementById('atlasSearch');
var expandBtn = document.getElementById('expandAllBtn');
var collapseBtn = document.getElementById('collapseAllBtn');

if(expandBtn) {
  expandBtn.addEventListener('click', function(){
    document.querySelectorAll('.pkg-accordion').forEach(function(d){ d.open = true; });
  });
}
if(collapseBtn) {
  collapseBtn.addEventListener('click', function(){
    document.querySelectorAll('.pkg-accordion').forEach(function(d){ d.open = false; });
  });
}

if(searchInput) {
  searchInput.addEventListener('input', function(e){
    var q = e.target.value.trim().toLowerCase();
    var terms = document.querySelectorAll('.term-card');
    if(!q) {
      terms.forEach(function(c){ c.classList.remove('highlight'); c.style.display = ''; });
      document.querySelectorAll('.pkg-accordion').forEach(function(d){ d.style.display = ''; });
      return;
    }
    terms.forEach(function(card){
      var txt = card.getAttribute('data-search') || '';
      if(txt.indexOf(q) > -1) {
        card.classList.add('highlight');
        card.style.display = '';
        var details = card.closest('details');
        if(details) { details.open = true; details.style.display = ''; }
      } else {
        card.classList.remove('highlight');
        card.style.display = 'none';
      }
    });
    // Hide details that have zero matches
    document.querySelectorAll('.pkg-accordion').forEach(function(details){
      var visibleCards = details.querySelectorAll('.term-card:not([style*="display: none"])');
      if(visibleCards.length === 0) {
        details.style.display = 'none';
      } else {
        details.style.display = '';
        details.open = true;
      }
    });
  });
}

/* ------------------------------------------------------------------
   Three.js Ascent Path & 3D Visual Entities (Design C)
   ------------------------------------------------------------------ */
if(window.THREE) {
  var canvas = document.getElementById('cCanvas');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 250);
  camera.position.set(0, 4, 15);

  var rootGroup = new THREE.Group();
  scene.add(rootGroup);

  var mats = [];
  function createMat(role, type, opacity) {
    var p = getThemeColors();
    var col = p[role] || p.ink;
    var m;
    if(type === 'mesh') {
      m = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: opacity || 0.12, depthWrite: false, side: THREE.DoubleSide });
    } else if(type === 'pts') {
      m = new THREE.PointsMaterial({ color: col, size: opacity || 0.08, sizeAttenuation: true, transparent: true, opacity: 0.85 });
    } else {
      m = new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: opacity || 1 });
    }
    m.userData = { role: role };
    mats.push(m);
    return m;
  }

  function recolorScene() {
    var p = getThemeColors();
    mats.forEach(function(m){
      var r = m.userData.role;
      m.color.set(p[r] || p.ink);
    });
  }

  function makeEdges(geo, role, op) {
    return new THREE.LineSegments(new THREE.EdgesGeometry(geo), createMat(role, 'line', op));
  }
  function makeCircle(r, role, op, seg) {
    var pts = []; seg = seg || 96;
    for(var i = 0; i <= seg; i++){
      var a = i / seg * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
    }
    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), createMat(role, 'line', op));
  }

  /* ----------------------------------------------------------------
     7 Distinct 3D Geometric Entities
     ---------------------------------------------------------------- */
  function createEntity(type) {
    var g = new THREE.Group();
    var updaters = [];

    // Stage 1: Mathematical Lattice & Gradient Flow
    if(type === 'lattice') {
      var ico = new THREE.IcosahedronGeometry(2.1, 1);
      g.add(makeEdges(ico, 'ink', 0.85));
      var oct = new THREE.OctahedronGeometry(1.15, 0);
      var octWire = makeEdges(oct, 'accent', 1);
      var octFill = new THREE.Mesh(oct, createMat('accent', 'mesh', 0.15));
      g.add(octWire); g.add(octFill);
      var pos = ico.attributes.position.array;
      var ptsGeo = new THREE.BufferGeometry();
      ptsGeo.setAttribute('position', new THREE.Float32BufferAttribute(Array.from(pos), 3));
      g.add(new THREE.Points(ptsGeo, createMat('accent', 'pts', 0.12)));
      updaters.push(function(t){
        octWire.rotation.y = -t * 0.7;
        octWire.rotation.x = t * 0.4;
        octFill.rotation.copy(octWire.rotation);
      });
    }

    // Stage 2: Attention Arcs & Transformer Tokens
    else if(type === 'attention') {
      var xs = [-2.4, -1.2, 0, 1.2, 2.4];
      var boxes = [];
      xs.forEach(function(x, i){
        var b = new THREE.BoxGeometry(0.7, 0.7, 0.7);
        var e = makeEdges(b, i === 2 ? 'accent' : 'ink', 1);
        e.position.x = x;
        var f = new THREE.Mesh(b, createMat('accent', 'mesh', i === 2 ? 0.28 : 0.08));
        f.position.x = x;
        g.add(e); g.add(f);
        boxes.push(e);
      });
      var arcs = [];
      [[0,2],[1,2],[3,2],[4,2],[0,4],[1,3]].forEach(function(pr, i){
        var x0 = xs[pr[0]], x1 = xs[pr[1]];
        var midX = (x0 + x1) / 2;
        var dist = Math.abs(x1 - x0);
        var arcPts = [];
        for(var k = 0; k <= 32; k++) {
          var u = k / 32;
          var px = x0 + (x1 - x0) * u;
          var py = Math.sin(u * Math.PI) * (dist * 0.55 + 0.4);
          arcPts.push(new THREE.Vector3(px, py, 0));
        }
        var arcLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcPts), createMat(i % 2 === 0 ? 'accent' : 'line', 'line', 0.85));
        g.add(arcLine);
        arcs.push(arcLine);
      });
      updaters.push(function(t){
        boxes.forEach(function(bx, i){
          bx.rotation.y = t * 0.8 + i;
          bx.rotation.x = t * 0.4;
        });
      });
    }

    // Stage 3: LLM Evaluation & Alignment Gyroscope
    else if(type === 'engine') {
      var rOuter = makeCircle(2.2, 'ink', 0.95);
      var rMid = makeCircle(1.65, 'accent', 1);
      var rInner = makeCircle(1.1, 'ink', 0.7);
      g.add(rOuter); g.add(rMid); g.add(rInner);
      var core = makeEdges(new THREE.DodecahedronGeometry(0.7, 0), 'accent', 1);
      g.add(core);
      updaters.push(function(t){
        rOuter.rotation.x = t * 0.5;
        rOuter.rotation.y = t * 0.3;
        rMid.rotation.y = -t * 0.8;
        rMid.rotation.z = t * 0.4;
        rInner.rotation.x = -t * 0.6;
        core.rotation.y = t * 1.2;
      });
    }

    // Stage 4: Microservices Pipeline Stack & MLOps Mesh
    else if(type === 'stack') {
      var layers = [];
      for(var i = 0; i < 4; i++) {
        var geo = new THREE.CylinderGeometry(1.8 - i * 0.22, 1.8 - i * 0.22, 0.28, 6);
        var e = makeEdges(geo, i % 2 === 0 ? 'accent' : 'ink', 1);
        e.position.y = -1 + i * 0.95;
        g.add(e);
        layers.push(e);
      }
      for(var k = 0; k < 4; k++) {
        var pts = [new THREE.Vector3(-1 + k * 0.66, -1.3, 0), new THREE.Vector3(-1 + k * 0.66, 1.6, 0)];
        var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), createMat('line', 'line', 0.65));
        g.add(l);
      }
      updaters.push(function(t){
        layers.forEach(function(b, i){
          b.position.y = -1 + i * 0.95 + Math.sin(t * 1.5 + i * 1.2) * 0.12;
          b.rotation.y = Math.sin(t * 0.6 + i) * 0.15;
        });
      });
    }

    // Stage 5: Geodesic Research Globe & Governance Rings
    else if(type === 'globe') {
      var globe = new THREE.Group();
      for(var i = -2; i <= 2; i++) {
        var y = i * 0.7, r = Math.sqrt(Math.max(0, 4 - y * y));
        var c = makeCircle(r, 'ink', 0.65);
        c.position.y = y; globe.add(c);
      }
      for(var j = 0; j < 6; j++) {
        var m = makeCircle(2, 'ink', 0.5);
        m.rotation.z = Math.PI / 2; m.rotation.y = j * Math.PI / 6;
        globe.add(m);
      }
      g.add(globe);
      var orbit = makeCircle(2.8, 'accent', 1);
      orbit.rotation.x = 1.15; orbit.rotation.z = 0.3;
      g.add(orbit);
      updaters.push(function(t){
        globe.rotation.y = t * 0.28;
        orbit.rotation.y = t * 0.85;
      });
    }

    // Stage 6: Tri-Modal Constellation (Vision, Audio, Action)
    else if(type === 'trio') {
      var center = makeEdges(new THREE.DodecahedronGeometry(0.75, 0), 'ink', 1);
      g.add(center);
      var shapes = [new THREE.OctahedronGeometry(0.45), new THREE.TetrahedronGeometry(0.5), new THREE.BoxGeometry(0.6, 0.6, 0.6)];
      var satellites = [];
      shapes.forEach(function(sh, i){
        var holder = new THREE.Group();
        var e = makeEdges(sh, 'accent', 1);
        e.position.x = 2.15;
        var f = new THREE.Mesh(sh, createMat('accent', 'mesh', 0.2));
        f.position.x = 2.15;
        holder.add(e); holder.add(f);
        var rod = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0.75, 0, 0), new THREE.Vector3(1.75, 0, 0)]), createMat('line', 'line', 0.8));
        holder.add(rod);
        holder.rotation.y = i * Math.PI * 2 / 3;
        holder.rotation.z = (i - 1) * 0.35;
        g.add(holder);
        satellites.push({ holder: holder, e: e, f: f });
      });
      updaters.push(function(t){
        center.rotation.y = -t * 0.45;
        satellites.forEach(function(s, i){
          s.holder.rotation.y = i * Math.PI * 2 / 3 + t * 0.65;
          s.e.rotation.x = t * (1 + i * 0.35);
          s.f.rotation.copy(s.e.rotation);
        });
      });
    }

    // Stage SI: Singularity Halo & Transcendent Cosmos
    else if(type === 'si') {
      var shells = [];
      [2.35, 1.65, 0.95].forEach(function(r, i){
        var e = makeEdges(new THREE.IcosahedronGeometry(r, i === 0 ? 1 : 0), i === 1 ? 'accent' : 'ink', i === 0 ? 0.45 : 1);
        g.add(e);
        shells.push(e);
      });
      var pts = [];
      for(var k = 0; k < 420; k++) {
        var theta = Math.random() * Math.PI * 2;
        var phi = Math.acos(2 * Math.random() - 1);
        var rad = 2.4 + Math.random() * 0.8;
        pts.push(new THREE.Vector3(rad * Math.sin(phi) * Math.cos(theta), rad * Math.sin(phi) * Math.sin(theta), rad * Math.cos(phi)));
      }
      var pGeo = new THREE.BufferGeometry().setFromPoints(pts);
      g.add(new THREE.Points(pGeo, createMat('accent', 'pts', 0.06)));
      updaters.push(function(t){
        shells[0].rotation.y = t * 0.2;
        shells[1].rotation.x = -t * 0.35;
        shells[2].rotation.z = t * 0.45;
      });
    }

    g.userData.update = function(t){ updaters.forEach(function(fn){ fn(t); }); };
    return g;
  }

  /* ----------------------------------------------------------------
     Build the Ascent Spiral Curve and Place Entities
     ---------------------------------------------------------------- */
  var P = [];
  for(var i = 0; i < 7; i++) {
    var angle = i * 0.95;
    var radius = (i === 6) ? 0 : 5.2;
    P.push(new THREE.Vector3(Math.sin(angle) * radius, i * 2.6, Math.cos(angle) * radius));
  }
  var curve = new THREE.CatmullRomCurve3(P);
  var curvePoints = curve.getPoints(320);

  // Background ascent track line
  rootGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curvePoints), createMat('line', 'line', 0.6)));

  // Highlighted progress line
  var progGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
  var progLine = new THREE.Line(progGeo, createMat('accent', 'line', 1));
  rootGroup.add(progLine);

  // Base platform circle
  var ground = makeCircle(8.2, 'line', 0.5, 120);
  ground.position.y = -1.6;
  rootGroup.add(ground);

  var platforms = [];
  ALL.forEach(function(stage, idx){
    var holder = new THREE.Group();
    holder.position.copy(P[idx]);
    var ring = makeCircle(idx === 6 ? 2.4 : 1.6, idx === 6 ? 'accent' : 'ink', 0.85);
    ring.position.y = -1.3;
    holder.add(ring);

    var ent = createEntity(stage.ent);
    var baseScale = (idx === 6) ? 0.85 : 0.55;
    ent.scale.setScalar(baseScale);
    holder.add(ent);
    rootGroup.add(holder);

    platforms.push({ holder: holder, ent: ent, baseScale: baseScale });
  });

  /* ----------------------------------------------------------------
     Pointer drag to rotate current 3D view
     ---------------------------------------------------------------- */
  var rot = { x: 0, y: 0, vx: 0, vy: 0.003, drag: false };
  var startX, startY;
  canvas.addEventListener('pointerdown', function(e){
    rot.drag = true;
    startX = e.clientX; startY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function(e){
    if(!rot.drag) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    startX = e.clientX; startY = e.clientY;
    rot.y += dx * 0.008;
    rot.x = Math.max(-0.6, Math.min(0.8, rot.x + dy * 0.004));
  });
  canvas.addEventListener('pointerup', function(e){
    rot.drag = false;
  });

  /* ----------------------------------------------------------------
     Intersection Observer to Track Current Active Stage
     ---------------------------------------------------------------- */
  var currentStage = 0;
  var stepElements = document.querySelectorAll('.c-step');
  var meterSpans = document.querySelectorAll('.c-meter span');

  function setActiveStage(idx) {
    if(currentStage === idx) return;
    currentStage = idx;
    stepElements.forEach(function(el, k){ el.classList.toggle('on', k === idx); });
    meterSpans.forEach(function(sp, k){ sp.classList.toggle('on', k <= idx); });
  }

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting) {
        var idx = parseInt(entry.target.getAttribute('data-index'), 10);
        setActiveStage(idx);
      }
    });
  }, { rootMargin: '-20% 0px -50% 0px', threshold: 0 });

  stepElements.forEach(function(step){ io.observe(step); });

  /* ----------------------------------------------------------------
     Resize & Render Loop
     ---------------------------------------------------------------- */
  function onResize() {
    var rect = canvas.getBoundingClientRect();
    if(rect.width === 0 || rect.height === 0) return;
    renderer.setSize(rect.width, rect.height, false);
    camera.aspect = rect.width / rect.height;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();

  var camTargetPos = new THREE.Vector3(0, 4, 15);
  var camTargetLook = new THREE.Vector3(0, 0, 0);

  var tStart = performance.now();
  function animate(now) {
    var t = (now - tStart) / 1000;

    var pt = P[currentStage];
    var outDir = new THREE.Vector3(pt.x, 0, pt.z);
    if(outDir.length() < 0.1) outDir.set(0, 0, 1);
    outDir.normalize();

    var desiredPos = new THREE.Vector3(pt.x + outDir.x * 8.5, pt.y + 3.2, pt.z + outDir.z * 8.5);
    if(currentStage === 6) {
      desiredPos.set(0, pt.y + 4.2, 15);
    }

    camTargetPos.lerp(desiredPos, 0.05);
    camTargetLook.lerp(pt, 0.06);

    camera.position.copy(camTargetPos);
    camera.lookAt(camTargetLook);

    if(!rot.drag) {
      rot.y += 0.002;
    }
    rootGroup.rotation.y = rot.y;
    rootGroup.rotation.x = rot.x;

    progGeo.setDrawRange(0, Math.round(320 * (currentStage / 6)) + 1);

    platforms.forEach(function(pl, i){
      var isCur = (i === currentStage);
      var targetS = isCur ? (pl.baseScale * 1.35) : pl.baseScale;
      var newS = pl.ent.scale.x + (targetS - pl.ent.scale.x) * 0.08;
      pl.ent.scale.setScalar(newS);
      if(pl.ent.userData.update) pl.ent.userData.update(t);
    });

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  var observer = new MutationObserver(function(){
    recolorScene();
  });
  observer.observe(root, { attributes: true, attributeFilter: ['data-skin', 'data-theme'] });
}

})();
</script>
