<div class="ax">

  <header class="ax-hero">
    <div class="ax-w">
      <div>
        <span class="ax-eyebrow">{{s:atlas_eyebrow}}</span>
        <h1>{{s:atlas_h1}}</h1>
      </div>
      <div>
        <p>{{s:atlas_lead}}</p>
        <div class="ax-meta" id="axMeta"></div>
      </div>
    </div>
  </header>

  <section class="ax-sec" id="axMap" aria-labelledby="axMapH">
    <div class="ax-w">
      <div class="ax-head">
        <div>
          <span class="ax-eyebrow">{{s:ax_map_kicker}}</span>
          <h2 id="axMapH">{{s:ax_map_h}}</h2>
          <p>{{s:ax_map_p}}</p>
        </div>
        <span class="ax-hint"><i></i>{{s:ax_hint}}</span>
      </div>
      <label class="ax-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="axQ" placeholder="{{s:ax_search}}" aria-label="{{s:ax_search}}" autocomplete="off">
        <output id="axCount"></output>
      </label>
      <div class="ax-frame ax-orbit">
        <svg id="axOrb" viewBox="0 0 1000 1000" direction="ltr" role="group" aria-label="{{s:atlas_h1}}"></svg>
        <aside class="ax-side" id="axSide" aria-labelledby="axMapH"></aside>
      </div>
    </div>
  </section>

  <section class="ax-sec" id="axJourney" aria-labelledby="axJrH">
    <div class="ax-w">
      <div class="ax-head">
        <div>
          <span class="ax-eyebrow">{{s:ax_journey_kicker}}</span>
          <h2 id="axJrH">{{s:ax_journey_h}}</h2>
          <p>{{s:ax_journey_p}}</p>
        </div>
      </div>
      <div class="ax-jr">
        <div id="axText"></div>
        <div class="ax-prog" id="axProg" aria-hidden="true"><i></i></div>
        <div class="ax-stick" id="axStick">
          <canvas id="axCanvas" aria-hidden="true"></canvas>
          <span class="ax-drag">{{s:atlas_drag_hint}}</span>
          <div class="ax-rail" id="axRail"></div>
          <div class="ax-hud" aria-hidden="true"><div class="big" id="axBig">01</div><div class="t" id="axT"></div></div>
        </div>
      </div>
    </div>
  </section>

  <div class="ax-tip" id="axTip" role="tooltip"></div>
  <div class="ax-scrim" id="axScrim" aria-hidden="true"></div>
  <aside class="ax-panel" id="axPanel" role="dialog" aria-modal="true" aria-labelledby="axPTitle">
    <div class="ax-p-top"><button type="button" class="ax-x" id="axClose" aria-label="{{s:ax_close}}">✕</button><div class="ax-crumb" id="axCrumb"></div></div>
    <div class="ax-p-body" id="axPBody"></div>
  </aside>

  <div id="axI18n" hidden
    data-pick="{{s:ax_pick}}" data-pickp="{{s:ax_pick_p}}" data-all="{{s:ax_all}}"
    data-ws="{{s:ax_w_stages}}" data-wp="{{s:ax_w_pkgs}}" data-wt="{{s:ax_w_terms}}"
    data-read="{{s:ax_read}}" data-filter="{{s:ax_filter}}" data-prev="{{s:ax_prev}}" data-next="{{s:ax_next}}"
    data-results="{{s:ax_results}}" data-none="{{s:ax_noresults}}" data-open="{{s:ax_open}}"></div>
</div>

{{atlas_data}}

<script src="/assets/atlas.js?v={{version}}" defer></script>
