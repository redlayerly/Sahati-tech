<div class="progress" aria-hidden="true"><span></span></div>
<article>
  <header class="post-hero{{hero_class}}">
    <div class="wrap">
      <nav class="crumbs" aria-label="{{s:crumbs_aria}}"><a href="{{prefix}}/">{{s:crumb_home}}</a><span class="sep" aria-hidden="true">/</span><a href="{{prefix}}/#feed">{{kind_label}}</a><span class="sep" aria-hidden="true">/</span><span>{{category_ar}}</span></nav>
      <div class="tagrow"><span class="tagchip solid">{{category_ar}}</span><span class="tagchip">{{kind_label_single}}</span></div>
      <h1>{{title}}</h1>
      <p class="dek">{{excerpt}}</p>
      <div class="meta">
        <span class="by"><svg viewBox="-60 -60 532 508" aria-hidden="true"><use href="#s-mark"/></svg>{{s:by}}</span>
        <span class="dot"></span><time datetime="{{date_iso}}">{{date_ar}}</time>
        <span class="dot"></span><span>{{read_time}}</span>
      </div>
    </div>
  </header>
{{cover_block}}
  <div class="wrap post-layout">
    <div class="prose">
{{body}}
      <div class="share share-end">
        <span class="lbl">{{s:share_label}}</span>
        <div class="btns">{{share_buttons}}</div>
        <span class="msg" role="status"></span>
      </div>
    </div>
    <aside>
{{toc}}
      <div class="share">
        <span class="lbl">{{s:share_label}}</span>
        <div class="btns">{{share_buttons}}</div>
        <span class="msg" role="status"></span>
      </div>
    </aside>
  </div>
</article>
<section class="post-end">
  <div class="wrap">
    <nav class="pn" aria-label="{{s:pn_aria}}">{{prev_next}}</nav>
{{related}}
  </div>
</section>
